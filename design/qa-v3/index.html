<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mod-Superman · 问答原型 V3</title>
<style>
:root{--red:#D71920;--yellow:#FFD600;--black:#000;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--white);color:var(--black);font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}button,select,textarea,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}button:disabled{cursor:wait}header{height:88px;margin:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--black)}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800;letter-spacing:-.7px}.symbol{display:grid;place-items:center;background:var(--red);color:var(--white);width:34px;height:34px;border-radius:50%;font-size:23px}.nav{display:flex;align-items:center;gap:28px;font-size:13px}.nav button{border:0;background:var(--white);padding:8px 0}.nav .new{border:1px solid var(--black);padding:10px 18px;border-radius:50px}.workspace{max-width:1000px;margin:0 auto;padding:62px 32px 40px}.hero{text-align:center;position:relative}.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:1px;text-transform:uppercase}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}h1{font-size:31px;line-height:1.5;font-weight:600;margin:22px 0 8px;letter-spacing:-1px}.slogan{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1.4;margin:0 0 18px}.slogan span{position:relative;white-space:nowrap}.slogan span::after{content:"";position:absolute;background:var(--yellow);height:11px;left:0;right:0;bottom:1px;z-index:-1}.sub{font-size:14px;line-height:1.8;margin:0}.spark{position:absolute;right:-10px;top:62px;font-size:64px;line-height:1;transform:rotate(12deg);color:var(--red)}.orbit{position:absolute;left:-5px;top:91px;width:36px;height:36px;border-radius:50%;border:2px solid var(--black)}.orbit:after{content:"";position:absolute;width:12px;height:12px;background:var(--yellow);border:1px solid var(--black);border-radius:50%;left:23px;top:-4px}.composer{max-width:864px;margin:36px auto 0;border:2px solid var(--black);border-radius:28px;padding:20px 24px 16px;background:var(--white)}.composer-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.object-picker{display:flex;align-items:center;gap:10px;font-size:12px}.object-picker select{appearance:auto;border:0;background:var(--yellow);border-radius:50px;padding:9px 14px;font-size:13px;max-width:250px}.scope{font-size:12px}.composer textarea{display:block;resize:vertical;min-height:92px;width:100%;border:0;outline:0;padding:20px 0 8px;font-size:18px;line-height:1.7;background:var(--white)}textarea::placeholder{color:var(--black);opacity:1}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.send{width:46px;height:46px;border:0;border-radius:50%;background:var(--red);color:var(--white);font-size:28px;display:grid;place-items:center}.suggestions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0 0}.suggestions button{background:var(--white);border:1px solid var(--black);border-radius:50px;padding:11px 16px;font-size:12px}.suggestions button:hover{background:var(--yellow)}.guide{max-width:864px;margin:48px auto 0;padding-top:24px;border-top:1px solid var(--black);display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.guide article{display:flex;align-items:flex-start;gap:12px}.number{width:30px;height:30px;border:1px solid var(--black);border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:12px}.guide strong{display:block;font-size:14px;margin:2px 0 7px}.guide p{font-size:12px;line-height:1.7;margin:0}.demo-note{font-size:11px;line-height:1.7;text-align:center;margin:25px 0 0}.thread{max-width:864px;margin:32px auto 0}.question{background:var(--black);color:var(--white);border-radius:24px 24px 4px 24px;padding:18px 24px;max-width:78%;margin-left:auto;line-height:1.8;font-size:15px;overflow-wrap:anywhere}.answer{margin-top:28px;display:grid;grid-template-columns:40px 1fr;gap:16px}.avatar{border-radius:50%;width:36px;height:36px;display:grid;place-items:center;background:var(--yellow);font-size:24px}.answer-body>strong{font-size:16px}.answer-body p{font-size:15px;line-height:1.9;margin:14px 0}.difference{border-top:1px solid var(--black);border-bottom:1px solid var(--black);display:flex;align-items:center;justify-content:space-between;gap:15px;margin:24px 0;padding:20px 0}.difference-label{font-size:14px}.values{display:flex;align-items:center;gap:18px}.old{font-size:22px}.target{border:0;background:var(--yellow);border-radius:50px;padding:8px 18px;font-size:23px;font-weight:700;min-width:84px;max-width:150px;text-align:center}.actions{display:flex;gap:12px;flex-wrap:wrap}.primary{background:var(--red);color:var(--white);border:0;border-radius:50px;padding:14px 24px;font-weight:600;font-size:14px}.secondary{background:var(--white);border:1px solid var(--black);border-radius:50px;padding:13px 22px;font-size:14px}.state{display:inline-flex;background:var(--yellow);padding:8px 13px;border-radius:50px;font-size:12px;margin-bottom:14px}.result-note{font-size:12px!important}.workspace.has-result{padding-top:28px}.has-result h1{font-size:25px;margin-top:0}.has-result .slogan,.has-result .eyebrow,.has-result .spark,.has-result .orbit,.has-result .sub,.has-result .guide,.has-result .suggestions{display:none}.has-result .composer{margin-top:32px}.has-result textarea{min-height:74px;font-size:15px}.has-result .composer-top{display:none}.hidden{display:none!important}.hint{font-size:13px;margin-top:12px;color:var(--red);min-height:18px;text-align:center}.modal-shade{position:fixed;inset:0;background:var(--black);display:grid;place-items:center;padding:24px;z-index:5}.modal{max-width:520px;width:100%;background:var(--white);border-radius:30px;padding:36px}.modal h2{font-size:24px;margin-top:0}.modal p{line-height:1.9;font-size:14px}.feedback-area{width:100%;min-height:120px;border:1px solid var(--black);border-radius:18px;padding:14px;resize:vertical;margin:10px 0 20px;background:var(--white)}@media(max-width:700px){header{height:72px;margin:0 20px}.brand{font-size:15px;gap:8px}.nav{gap:12px}.nav .new{padding:8px 12px}.workspace{padding:42px 20px 30px}h1{font-size:22px;margin:18px 0 12px}.slogan{font-size:32px;letter-spacing:-1px}.spark,.orbit{display:none}.composer{padding:16px;border-radius:24px;margin-top:26px}.object-picker{gap:5px}.object-picker select{max-width:210px}.scope{display:none}.composer textarea{font-size:16px;min-height:120px}.guide{gap:16px;margin-top:32px}.guide article{display:block}.number{margin-bottom:10px}.guide strong{font-size:12px}.guide p{font-size:11px}.question{max-width:90%}.answer{grid-template-columns:30px 1fr;gap:10px}.avatar{width:28px;height:28px;font-size:20px}.difference{align-items:flex-start}.values{gap:8px}.old,.target{font-size:18px}.target{min-width:70px}.primary,.secondary{font-size:12px;padding:12px 16px}.composer-bottom{font-size:11px}.suggestions{gap:8px}.suggestions button{font-size:11px;padding:10px 12px}}
</style></head><body>
<header><div class="brand"><span class="symbol" aria-hidden="true">✦</span>MOD—SUPERMAN</div><nav class="nav"><button id="help">使用指南</button><button class="new" id="reset">＋ 新的修改</button></nav></header>
<main class="workspace" id="workspace"><section class="hero"><span class="eyebrow"><i class="dot"></i>MAKE IT YOURS</span><h1>博德之门3个性化Mod生成器</h1><p class="slogan">生成你的<span>私人定制Mod</span>！</p><p class="sub">选好装备或技能，告诉我们你想怎么改。<br>先看清修改方案，再确认生成。</p><span class="spark" aria-hidden="true">✳</span><span class="orbit" aria-hidden="true"></span></section>
<section class="thread hidden" id="thread" aria-live="polite"><div class="question" id="question"></div><div class="answer"><div class="avatar" aria-hidden="true">✦</div><div class="answer-body"><strong id="answer-title">这是你的修改方案</strong><div id="answer-copy"></div><div class="difference hidden" id="difference"><span class="difference-label" id="field-label">基础伤害</span><div class="values"><span class="old" id="original">1d6</span><span aria-hidden="true">→</span><input class="target" id="target" value="2d6" aria-label="修改后的参数"></div></div><div class="actions hidden" id="actions"><button class="primary" id="confirm">确认参数</button><button class="secondary" id="edit">继续调整</button></div></div></div></section>
<form class="composer" id="prompt-form"><div class="composer-top"><label class="object-picker">修改对象 <select id="object"><option value="sword">第一滴血短剑 · 装备</option><option value="heal">治愈真言 · 技能</option></select></label><span class="scope">一次修改一个对象</span></div><textarea id="prompt" aria-label="描述修改期望" placeholder="例如：把基础伤害骰数量翻倍，保留其他效果。" maxlength="1200"></textarea><div class="composer-bottom"><span id="composer-label">描述具体期望，参数由你最终确认</span><button type="submit" class="send" id="send" aria-label="发送修改需求">↑</button></div></form>
<div class="hint" id="hint" role="status"></div><div class="suggestions"><button data-example="damage">↗ 基础伤害翻倍</button><button data-example="name">↗ 改一个装备名称</button><button data-example="heal">↗ 施法距离改为36米</button></div>
<section class="guide"><article><span class="number">01</span><div><strong>说出你的想法</strong><p>选定对象，输入修改期望。</p></div></article><article><span class="number">02</span><div><strong>看清，再确认</strong><p>检查参数差异与影响范围。</p></div></article><article><span class="number">03</span><div><strong>下载并验证</strong><p>按说明操作，反馈游戏效果。</p></div></article></section><p class="demo-note">设计预览 · 使用本地示例演示，不连接模型或生成真实Mod</p></main>
<div class="modal-shade hidden" id="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">使用指南</h2><div id="modal-copy"></div><button class="secondary" id="close-modal">关闭</button></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let current=null,confirmed=false;function modal(title,content){$('modal-title').textContent=title;$('modal-copy').replaceChildren();const p=document.createElement('p');p.textContent=content;$('modal-copy').appendChild(p);$('modal-shade').classList.remove('hidden');$('close-modal').focus()}
function answer(title,paragraphs,plan){$('workspace').classList.add('has-result');$('thread').classList.remove('hidden');$('answer-title').textContent=title;$('answer-copy').replaceChildren();for(const str of paragraphs){const p=document.createElement('p');p.textContent=str;$('answer-copy').appendChild(p)}current=plan;confirmed=false;$('difference').classList.toggle('hidden',!plan);$('actions').classList.toggle('hidden',!plan);if(plan){$('field-label').textContent=plan.label;$('original').textContent=plan.old;$('target').value=plan.value;$('target').readOnly=false;$('confirm').textContent='确认参数'}$('prompt').value='';$('prompt').placeholder='需要调整哪里？继续告诉我们。';$('hint').textContent=''}
$('prompt-form').addEventListener('submit',e=>{e.preventDefault();const q=$('prompt').value.trim();if(!q){$('hint').textContent='请先输入修改期望。';$('prompt').focus();return}$('question').textContent=q;const object=$('object').value;let plan=null;if(object==='sword'&&/伤害/.test(q)&&(/翻倍|2d6/.test(q))){plan={object:'第一滴血短剑',label:'基础伤害',old:'1d6',value:'2d6',kind:'dice'};answer('已理解，先确认这次修改。',['第一滴血短剑的基础伤害骰由1个增加到2个。仅修改基础伤害字段，其他配置不主动改写。','该记录可能影响共用数据的装备，不承诺只修改背包中的一个实例。本次新包仍需游戏验证。'],plan)}else if(object==='heal'&&/36/.test(q)){plan={object:'治愈真言',label:'施法距离（米）',old:'18',value:'36',kind:'distance'};answer('距离修改方案已整理。',['治愈真言的施法距离从18米改为36米，治疗量与消耗不主动修改。','历史36米方案获用户报告通过；精确边界、升环与本次新包效果仍需验证。'],plan)}else if(object==='sword'&&/曙光短剑/.test(q)){plan={object:'第一滴血短剑',label:'简体中文名称',old:'第一滴血短剑',value:'曙光短剑',kind:'name'};answer('名称修改方案已整理。',['将第一滴血短剑的简体中文名称改为曙光短剑，装备数值不主动修改。','名称仅覆盖允许的中文文本句柄，本次新包仍需检查显示效果。'],plan)}else{answer('请再具体一点。',['请说明你要修改的字段和目标值。例如基础伤害改为2d6，或治愈真言施法距离改为36米。','此预览只演示这些示例，不会把其他输入伪装成真实AI解析结果。'],null)}});
document.querySelectorAll('[data-example]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.example;$('object').value=k==='heal'?'heal':'sword';$('prompt').value=k==='damage'?'把基础伤害骰数量翻倍，保留其他效果。':k==='name'?'把第一滴血短剑的名称改为曙光短剑。':'把治愈真言施法距离改为36米。';$('prompt').focus()}));$('object').addEventListener('change',()=>{current=null;confirmed=false;$('thread').classList.add('hidden');$('workspace').classList.remove('has-result');$('prompt').value='';$('prompt').placeholder=$('object').value==='heal'?'例如：将治愈真言的施法距离改为36米。':'例如：把基础伤害骰数量翻倍，保留其他效果。'});
$('target').addEventListener('input',()=>{confirmed=false;$('confirm').textContent='重新确认参数';$('hint').textContent='参数已变化，需要重新确认。'});$('confirm').addEventListener('click',()=>{if(!current)return;const v=$('target').value.trim();if(current.kind==='dice'&&!/^(?:[1-9]|10)d(?:4|6|8|10|12|20)$/.test(v)){$('hint').textContent='伤害格式应为NdS，骰数1～10，骰面4/6/8/10/12/20。';return}if(current.kind==='distance'&&(!/^\d+(?:\.\d)?$/.test(v)||+v<1||+v>60)){$('hint').textContent='距离需为1～60米，最多一位小数。';return}if(current.kind==='name'&&(v.length<1||v.length>60||/[\u0000-\u001f]/.test(v))){$('hint').textContent='名称需为1～60字符，禁止控制字符。';return}if(!confirmed){confirmed=true;$('target').readOnly=true;$('confirm').textContent='生成修改文件';$('answer-title').textContent='参数已确认。';$('hint').textContent='已确认本次具体参数，继续即可查看生成状态演示。'}else{modal('生成状态预览','确认参数→程序校验→生成文件→提供下载。本地预览没有执行生成器，因此没有真实文件可供下载。')}});$('edit').addEventListener('click',()=>{$('target').readOnly=false;confirmed=false;$('confirm').textContent='重新确认参数';$('prompt').focus()});$('help').addEventListener('click',()=>modal('从想法到游戏效果','选择装备或技能，输入具体修改期望。查看返回的方案与作用范围，确认参数后生成文件。按说明完成本地操作，检查游戏效果并反馈。'));$('reset').addEventListener('click',()=>{current=null;confirmed=false;$('workspace').classList.remove('has-result');$('thread').classList.add('hidden');$('prompt').value='';$('prompt').placeholder='例如：把基础伤害骰数量翻倍，保留其他效果。';$('object').value='sword';$('hint').textContent='';$('prompt').focus()});$('close-modal').addEventListener('click',()=>{$('modal-shade').classList.add('hidden');$('prompt').focus()});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal-shade').classList.add('hidden')});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){$('prompt-form').requestSubmit()}});
})();
</script></body></html>
